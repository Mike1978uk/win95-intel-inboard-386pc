; bluescsi.ini for the IBM 5160 (T130B, Windows 95) - issue #50
; Copy to the root of the BlueSCSI SD card. Built, untested on the 5160.
;
; Firmware: needs cloud/bluescsi/firmware/BlueSCSI_Pico_2_DaynaPORT_hostedluns.uf2
; (branch claude/bluescsi-5160-firmware-o12wij). The stock v2026.08.17 firmware ignores
; EnableLUNs and loads only the LUN 0 image.
;
; Image files on the card root. The name sets the device: 3rd character = SCSI ID,
; 4th character = LUN.
;   HD5_512.hda    ID 5 LUN 0  disk - your existing working image, renamed
;   HD51_512.hda   ID 5 LUN 1  second disk - read-only attribute on both disk images
;                              for the first boot (cloud/bluescsi/REPORT.md test 1)
;   NE53.img       ID 5 LUN 3  DaynaPORT network - an empty file
; Optional, REPORT.md test 3:
;   RE52_a.img, RE52_b.img     ID 5 LUN 2  removable disk, swapped on each eject
;
; ID 5 must be free on the SCSI chain. On 2026-10-21 the Jaz drive was at ID 5: move it
; or unplug it first.
;
; USB: nothing to set. The firmware has no USB host support; see DESIGN.md section 4.

[SCSI]
EnableLUNs = 1
; Logs every command with its LUN to log.txt on the card; the tests read it.
Debug = 1
; Your WiFi network. Do not commit a real password to git. If the name or password
; contains ; or #, put it in double quotes, or it is cut short there.
WiFiSSID = your-network-name
WiFiPassword = your-wifi-password

[SCSI5L1]
Vendor = BLUESCSI
Product = LUN1 DISK
