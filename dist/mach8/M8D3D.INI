; C:\M8D3D.INI - optional. Read when a DirectX program starts; defaults shown.
[diag]
; trace=1 writes C:\M8TRACE.TXT (surface create/destroy, flips). Leave 0: it adds disk writes.
trace=0
[feed]
; Direct3D frames are sent to the card from a timer while the program draws the next one.
on=1
[d3d]
; Offer Direct3D at 8 bpp as well as 16 bpp.
render8=1
; Draw Direct3D at half resolution (faster).
lores=1
; Sort triangles back to front instead of using a Z buffer.
zsort=0
; Per-program overrides: a section named after the program's EXE, same keys.
[M8TWIST.EXE]
lores=0
zsort=1
palette=1
